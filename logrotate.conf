# Douyin Download Service - logrotate configuration
#
# Deployment on BT Panel:
# Project path: /www/wwwroot/douyin_service
# Run as user: www
# Installation: sudo cp logrotate.conf /etc/logrotate.d/douyin-service

/www/wwwroot/douyin_service/logs/*.log {
    # Daily rotation (alternative: weekly, monthly)
    daily
    
    # Keep 7 days of log files
    rotate 7
    
    # Don't error if log file is missing
    missingok
    
    # Don't rotate if log is empty
    notifempty
    
    # Compress old logs with gzip
    compress
    
    # Delay compression for current rotation
    delaycompress
    
    # Use date as suffix
    dateext
    
    # Date format: download_tasks.log-20260117
    dateformat -%Y%m%d
    
    # Copy and truncate (IMPORTANT for Python logging)
    copytruncate
    
    # Create new log file with permissions and owner (BT Panel uses www user)
    create 0644 www www

    # Optional: post-rotation script
    postrotate
        # BT Panel Python projects usually don't need reload
        # If using supervisor, uncomment:
        # supervisorctl restart douyin-service > /dev/null 2>&1 || true
    endscript
}

# Alternative: Size-based rotation (if you have large log volume)
# Uncomment below and comment out above configuration if needed
#
# /www/wwwroot/douyin_service/logs/*.log {
#     size 100M
#     rotate 10
#     missingok
#     notifempty
#     compress
#     delaycompress
#     copytruncate
#     create 0644 www www
# }
